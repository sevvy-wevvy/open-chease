name: pr rules

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  pull-requests: write

jobs:
  check:
    if: github.event.pull_request.author_association != 'OWNER'
    runs-on: ubuntu-latest
    steps:
      # never checks out the pr code, only reads the file list
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          why=""
          if [ "$BASE" != "dev" ]; then
            why="PRs go to the dev branch, this one is against $BASE."
          fi
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          if echo "$files" | grep -q '^bin/'; then
            why="$why It changes files in bin/, those get rebuilt before shipping so PRs cant touch them."
          fi
          # plugin files, or any changed line anywhere that mentions plug (the calls left in main.c)
          lines=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].patch // empty' | grep -E '^[+-]')
          # github leaves the patch out on huge files, cant check those so they dont get in
          if gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | select(.patch == null and .changes > 0 and (.filename | test("^bin/") | not)) | .filename' | grep -q .; then
            why="$why A file in it is too big for me to check, split it into smaller PRs."
          fi
          if echo "$files" | grep -qE '^src/plug|^PLUGINS\.md$|^plugins-examples/|^tests/plug' || echo "$lines" | grep -qi 'plug'; then
            why="$why It changes plugin code or docs, plugins run other peoples programs so only I change that part. Open an issue instead."
          fi
          if [ -n "$why" ]; then
            gh pr close "$PR" -R "$REPO" --comment "Closed automatically. $why Check [CONTRIBUTING.md](https://github.com/$REPO/blob/dev/CONTRIBUTING.md), fix it and open a new PR against dev."
          else
            echo "follows the rules"
          fi
